version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: devops_db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  backend:
    build: ./backend
    container_name: devops_backend
    env_file:
      - .env
    environment:
      DB_HOST: db
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    container_name: devops_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
