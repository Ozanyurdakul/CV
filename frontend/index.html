<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozan Yurdakul | Yazılım Mühendisi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0f16;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.4);
            --text-main: #f0f4f8;
            --text-muted: #a0aec0;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0; 
            font-family: 'Roboto', sans-serif;
            background: url('bg.png') no-repeat center center/cover fixed;
            background-color: var(--bg-dark);
            color: var(--text-main);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        
        /* Dark Overlay to make text readable across the whole page */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 22, 0.85); /* Siyah filtre */
            z-index: -1;
        }
        
        h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }

        /* Full Screen Hero */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        /* Gradient for Hero text readability (optional now but adds depth) */
        .hero::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to top, var(--bg-dark) 0%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .hero-title {
            font-size: 5rem;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: slideDown 1s ease-out;
        }

        .hero-subtitle {
            font-size: 2rem;
            font-weight: 300;
            color: var(--accent);
            margin-top: 10px;
            animation: slideUp 1s ease-out 0.5s both;
            height: 40px; /* Typewriter space */
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            font-size: 2rem;
            color: var(--accent);
            animation: bounce 2s infinite;
        }

        /* Navbar */
        .nav-bar {
            position: fixed;
            top: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px;
            box-sizing: border-box;
            background: transparent;
            z-index: 1000;
            transition: background 0.3s, backdrop-filter 0.3s;
        }
        .nav-bar.scrolled {
            background: rgba(10, 15, 22, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }
        .nav-btn {
            background: transparent; border: 1px solid var(--accent); color: var(--accent);
            padding: 8px 20px; border-radius: 30px; cursor: pointer; font-size: 0.9rem; font-weight: bold;
            transition: all 0.3s ease;
        }
        .nav-btn:hover { background: var(--accent); color: var(--bg-dark); box-shadow: 0 0 15px var(--accent-glow); }

        /* Container for Main Content */
        .container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; }

        /* Section Titles */
        .section-title {
            font-size: 3rem; font-weight: 900; text-align: center; margin: 100px 0 50px;
            text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.9);
        }

        /* Timeline / Staggered Layout for Cards */
        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: relative;
        }
        
        /* The vertical line */
        .timeline-container::before {
            content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 100%;
            background: linear-gradient(to bottom, var(--accent), transparent);
            transform: translateX(-50%);
            opacity: 0.3;
        }

        .timeline-item {
            display: flex;
            justify-content: flex-start;
            width: 100%;
            opacity: 0; /* For scroll animation */
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .timeline-item:nth-child(even) { justify-content: flex-end; }
        
        .timeline-item.slide-left { transform: translateX(-100px); }
        .timeline-item.slide-right { transform: translateX(100px); }
        .timeline-item.is-visible { opacity: 1; transform: translateX(0); }

        .timeline-content {
            width: 45%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }
        .timeline-content:hover { transform: translateY(-5px); border-color: var(--accent); }

        .timeline-content h4 { margin: 0 0 10px; font-size: 1.5rem; color: #fff; }
        .timeline-content .date { color: var(--accent); font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; }
        .timeline-content .subtitle { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 5px; }

        .timeline-content ul { 
            padding-left: 20px; color: var(--text-muted); line-height: 1.6; 
            max-height: 0; opacity: 0; overflow: hidden; margin: 0;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .timeline-content:hover ul { max-height: 1500px; opacity: 1; margin-top: 15px; margin-bottom: 15px; }

        /* Admin Action Buttons */
        .admin-controls { text-align: center; margin-bottom: 30px; display: none; }
        .admin-btn {
            background: #f39c12; color: #fff; border: none; padding: 10px 25px; 
            border-radius: 30px; cursor: pointer; font-size: 1rem; font-weight: bold;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.3); transition: 0.3s;
        }
        .admin-btn:hover { background: #e67e22; transform: scale(1.05); }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .modal-content { background: #0f172a; margin: 8% auto; padding: 40px; width: 90%; max-width: 500px; border-radius: 20px; border: 1px solid var(--accent); position: relative; box-shadow: 0 0 40px rgba(0, 210, 255, 0.2); }
        .close-btn { position: absolute; right: 25px; top: 20px; cursor: pointer; font-size: 2rem; color: #64748b; transition: 0.3s;}
        .close-btn:hover { color: #fff; }
        
        input, textarea { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid var(--glass-border); border-radius: 8px; background: rgba(0,0,0,0.3); color: #fff; box-sizing: border-box; font-family: 'Roboto', sans-serif;}
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        .btn-submit { width: 100%; padding: 15px; background: var(--accent); color: var(--bg-dark); font-weight: 900; font-size: 1.1rem; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: 0.3s;}
        .btn-submit:hover { box-shadow: 0 0 20px var(--accent-glow); transform: translateY(-2px);}

        /* Comments Section */
        .comments-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .comment-box { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 25px; border-radius: 12px; border-left: 4px solid var(--accent); transition: transform 0.3s; opacity: 0; transform: translateY(30px); }
        .comment-box.is-visible { opacity: 1; transform: translateY(0); }
        .comment-box strong { color: #fff; font-size: 1.2rem; font-family: 'Montserrat', sans-serif;}
        .comment-box p { color: var(--text-muted); margin: 10px 0; line-height: 1.6;}
        .comment-box small { color: #64748b; }

        /* Animations */
        @keyframes slideDown { from { opacity: 0; transform: translateY(-50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); } 40% { transform: translateY(-20px) translateX(-50%); } 60% { transform: translateY(-10px) translateX(-50%); } }

        @media (max-width: 768px) {
            .timeline-container::before { left: 20px; }
            .timeline-item, .timeline-item:nth-child(even) { justify-content: flex-end; }
            .timeline-content { width: calc(100% - 50px); }
            .hero-title { font-size: 3rem; }
        }
    </style>
</head>
<body>


<div class="nav-bar" id="navbar">
    <div id="userInfo" style="font-weight:bold; letter-spacing:1px;">ZIYARETCI</div>
    <div id="authButtons">
        <button class="nav-btn" onclick="openModal('loginModal')">GİRİŞ YAP</button>
        <button class="nav-btn" onclick="openModal('registerModal')" style="background: var(--accent); color: var(--bg-dark);">KAYIT OL</button>
    </div>
    <div id="profileButtons" style="display: none;">
        <button class="nav-btn" onclick="logout()">ÇIKIŞ YAP</button>
    </div>
</div>


<div class="hero">
    <div class="hero-content">
        <h1 class="hero-title">Ozan Yurdakul</h1>
        <div class="hero-subtitle" id="typewriter"></div>
    </div>
    <div class="scroll-indicator">↓</div>
</div>


<div class="container">
    
    
    <h2 class="section-title">İş Deneyimi</h2>
    <div class="admin-controls"><button class="admin-btn" onclick="openAddCVModal('experience')">+ Deneyim Ekle</button></div>
    <div class="timeline-container" id="experience-list">Yükleniyor...</div>

    
    <h2 class="section-title">Projeler</h2>
    <div class="admin-controls"><button class="admin-btn" onclick="openAddCVModal('project')">+ Proje Ekle</button></div>
    <div class="timeline-container" id="project-list">Yükleniyor...</div>

    
    <h2 class="section-title">Eğitim</h2>
    <div class="admin-controls"><button class="admin-btn" onclick="openAddCVModal('education')">+ Eğitim Ekle</button></div>
    <div class="timeline-container" id="education-list">Yükleniyor...</div>

    
    <div id="certificates-section" style="display: none;">
        <h2 class="section-title">Sertifikalar</h2>
        <div class="admin-controls"><button class="admin-btn" onclick="openAddCVModal('certificate')">+ Sertifika Ekle</button></div>
        <div class="timeline-container" id="certificate-list"></div>
    </div>

    
    <h2 class="section-title">Ziyaretçi Yorumları</h2>
    <div id="comment-form-container" style="display: none; max-width: 600px; margin: 0 auto 40px auto; background: var(--glass-bg); padding: 30px; border-radius: 15px; border: 1px solid var(--accent);">
        <h3 style="margin-top:0;">Düşünceleriniz...</h3>
        <textarea id="newComment" rows="4" placeholder="Harika bir CV!"></textarea>
        <button class="btn-submit" onclick="postComment()">Yorumu Gönder</button>
    </div>
    <p id="login-to-comment" style="text-align:center; color: var(--accent); font-weight:bold; margin-bottom: 40px;">Yorum yapmak için lütfen giriş yapın veya kayıt olun.</p>
    <div class="comments-grid" id="commentsList">Yorumlar yükleniyor...</div>

</div>


<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
        <h2>Yönetim / Giriş</h2>
        <input type="text" id="loginUser" placeholder="Kullanıcı Adı">
        <input type="password" id="loginPass" placeholder="Şifre">
        <button class="btn-submit" onclick="login()">Giriş Yap</button>
    </div>
</div>

<div id="registerModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('registerModal')">&times;</span>
        <h2>Ziyaretçi Kaydı</h2>
        <input type="text" id="regUser" placeholder="Kullanıcı Adı">
        <input type="password" id="regPass" placeholder="Şifre">
        <button class="btn-submit" onclick="register()">Kayıt Ol & Giriş Yap</button>
    </div>
</div>

<div id="addCVModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('addCVModal')">&times;</span>
        <h2>Yeni Veri Ekle</h2>
        <input type="hidden" id="cvType">
        <input type="text" id="cvTitle" placeholder="Başlık (Örn: Stajyer / Sertifika Adı)">
        <input type="text" id="cvSubtitle" placeholder="Alt Başlık (Şirket / Kurum)">
        <input type="text" id="cvDate" placeholder="Tarih (Örn: 2025-2026)">
        <textarea id="cvDesc" rows="4" placeholder="Açıklamalar (Her satıra bir madde yazın)"></textarea>
        <button class="btn-submit" onclick="submitCV()">Sisteme Kaydet</button>
    </div>
</div>

<script>
    const API_URL = '/api';
    let currentUser = null;

    
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) document.getElementById('navbar').classList.add('scrolled');
        else document.getElementById('navbar').classList.remove('scrolled');
    });

    
    const twWords = ["Yazılım Mühendisi", "Full-Stack Geliştirici", "Yapay Zeka Tutkunu"];
    let twI = 0, twJ = 0, twIsDeleting = false, twElem = document.getElementById('typewriter');
    function typeWriter() {
        const currentWord = twWords[twI];
        if (twIsDeleting) {
            twElem.innerText = currentWord.substring(0, twJ - 1);
            twJ--;
        } else {
            twElem.innerText = currentWord.substring(0, twJ + 1);
            twJ++;
        }
        let typeSpeed = twIsDeleting ? 50 : 100;
        if (!twIsDeleting && twJ === currentWord.length) { typeSpeed = 2000; twIsDeleting = true; }
        else if (twIsDeleting && twJ === 0) { twIsDeleting = false; twI = (twI + 1) % twWords.length; typeSpeed = 500; }
        setTimeout(typeWriter, typeSpeed);
    }
    typeWriter();

    
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                
            }
        });
    }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

    function observeElements() {
        document.querySelectorAll('.timeline-item, .comment-box').forEach(el => observer.observe(el));
    }

    
    function updateUI() {
        if(currentUser) {
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('profileButtons').style.display = 'block';
            document.getElementById('userInfo').innerText = `Hoşgeldin, ${currentUser.username.toUpperCase()}`;
            document.getElementById('comment-form-container').style.display = 'block';
            document.getElementById('login-to-comment').style.display = 'none';

            
            if(currentUser.isAdmin) {
                document.querySelectorAll('.admin-controls').forEach(div => div.style.display = 'block');
                document.getElementById('certificates-section').style.display = 'block';
            } else {
                document.querySelectorAll('.admin-controls').forEach(div => div.style.display = 'none');
            }
        } else {
            document.getElementById('authButtons').style.display = 'block';
            document.getElementById('profileButtons').style.display = 'none';
            document.getElementById('userInfo').innerText = `ZİYARETÇİ`;
            document.getElementById('comment-form-container').style.display = 'none';
            document.getElementById('login-to-comment').style.display = 'block';
            document.querySelectorAll('.admin-controls').forEach(div => div.style.display = 'none');
        }
    }

    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    
    function openAddCVModal(type) {
        document.getElementById('cvType').value = type;
        document.getElementById('cvTitle').value = '';
        document.getElementById('cvSubtitle').value = '';
        document.getElementById('cvDate').value = '';
        document.getElementById('cvDesc').value = '';
        openModal('addCVModal');
    }

    async function apiFetch(endpoint, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        const token = localStorage.getItem('cv_token');
        if(token) headers['Authorization'] = `Bearer ${token}`;
        
        const options = { method, headers };
        if(body) options.body = JSON.stringify(body);
        
        const res = await fetch(API_URL + endpoint, options);
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'API Hatası');
        return data;
    }

    async function login() {
        try {
            const data = await apiFetch('/auth/login', 'POST', {
                username: document.getElementById('loginUser').value,
                password: document.getElementById('loginPass').value
            });
            localStorage.setItem('cv_token', data.token);
            currentUser = data.user;
            updateUI();
            closeModal('loginModal');
            fetchCV(); 
        } catch (e) { alert(e.message); }
    }

    async function register() {
        try {
            const data = await apiFetch('/auth/register', 'POST', {
                username: document.getElementById('regUser').value,
                password: document.getElementById('regPass').value
            });
            localStorage.setItem('cv_token', data.token);
            currentUser = data.user;
            updateUI();
            closeModal('registerModal');
        } catch (e) { alert(e.message); }
    }

    function logout() {
        localStorage.removeItem('cv_token');
        currentUser = null;
        updateUI();
        fetchCV();
    }

    function renderCVTimeline(items, containerId) {
        const container = document.getElementById(containerId);
        if(items.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Henüz kayıt bulunmamaktadır.</p>';
            return;
        }
        
        container.innerHTML = items.map((item, index) => {
            const slideClass = index % 2 === 0 ? 'slide-left' : 'slide-right';
            return `
            <div class="timeline-item ${slideClass}">
                <div class="timeline-content">
                    <div class="date">${item.date_str || ''}</div>
                    <h4>${item.title}</h4>
                    <div class="subtitle">${item.subtitle || ''}</div>
                    <ul>${(item.descriptions || []).map(d => `<li>${d}</li>`).join('')}</ul>
                </div>
            </div>
        `}).join('');
    }

    async function fetchCV() {
        try {
            const data = await apiFetch('/cv');
            renderCVTimeline(data.filter(i => i.type === 'experience'), 'experience-list');
            renderCVTimeline(data.filter(i => i.type === 'project'), 'project-list');
            renderCVTimeline(data.filter(i => i.type === 'education'), 'education-list');
            
            const certs = data.filter(i => i.type === 'certificate');
            if(certs.length > 0 || (currentUser && currentUser.isAdmin)) {
                document.getElementById('certificates-section').style.display = 'block';
                renderCVTimeline(certs, 'certificate-list');
            } else {
                document.getElementById('certificates-section').style.display = 'none';
            }
            
            setTimeout(observeElements, 200);
        } catch(e) { console.error("CV yüklenemedi", e); }
    }

    async function submitCV() {
        try {
            const lines = document.getElementById('cvDesc').value.split('\n').filter(l => l.trim() !== '');
            await apiFetch('/cv', 'POST', {
                type: document.getElementById('cvType').value,
                title: document.getElementById('cvTitle').value,
                subtitle: document.getElementById('cvSubtitle').value,
                date_str: document.getElementById('cvDate').value,
                descriptions: lines
            });
            closeModal('addCVModal');
            fetchCV();
        } catch(e) { alert('Hata: ' + e.message); }
    }

    async function fetchComments() {
        try {
            const data = await apiFetch('/comments');
            const list = document.getElementById('commentsList');
            if(data.length === 0) list.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Henüz yorum yok. İlk yorumu sen yap!</p>';
            else {
                list.innerHTML = data.map(c => `
                    <div class="comment-box">
                        <strong>${c.username.toUpperCase()}</strong>
                        <small style="float:right">${new Date(c.created_at).toLocaleString('tr-TR')}</small>
                        <p>${c.content}</p>
                    </div>
                `).join('');
            }
            setTimeout(observeElements, 200);
        } catch (e) { console.error(e); }
    }

    async function postComment() {
        const val = document.getElementById('newComment').value;
        if(!val) return;
        try {
            await apiFetch('/comments', 'POST', { content: val });
            document.getElementById('newComment').value = '';
            fetchComments();
        } catch (e) { alert(e.message); }
    }

    window.onload = async () => {
        
        if(localStorage.getItem('cv_token')) {
            try {
                const data = await apiFetch('/auth/me');
                currentUser = data.user;
            } catch(e) { localStorage.removeItem('cv_token'); currentUser = null; }
        }
        updateUI();
        fetchCV();
        fetchComments();
    };
</script>

</body>
</html>
